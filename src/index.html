<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script type="module" src="/launcher.js"></script>
  <link rel="manifest" href="/.well-known/manifest.webmanifest" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .splash-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .splash-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .splash-title {
      font-size: 32px;
      font-weight: 700;
      color: #21242c;
      letter-spacing: -0.5px;
    }

    #fallback-controls {
      display: none;
      position: absolute;
      bottom: 24px;
      text-align: center;
    }

    .bold {
      font-weight: bold;
    }

    button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background: #14bf96;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #555555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="/splashscreen.png" alt="Khan Academy Logo" class="splash-logo" />
    <h1 class="splash-title">Khan Academy</h1>
  </div>

  <div id="fallback-controls">
    <p style="color: #666; font-size: 13px; margin-bottom: 8px;">
      Window management state: <span id="permission-state" class="bold">UNKNOWN</span>
    </p>
    <button id="permission-prompt">Grant Window Permission</button>
  </div>
</body>
</html>
