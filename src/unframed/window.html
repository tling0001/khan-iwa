<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script type="module" src="/unframed/unframed.js"></script>
  <link rel="manifest" href="/.well-known/manifest.webmanifest" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      position: relative;
    }

    /* Window Controls Overlay Container */
    .window-controls {
      position: absolute;
      top: 0;
      right: 0;
      height: 32px;
      z-index: 99999;
      display: flex;
      align-items: center;
    }

    /* Draggable square handle placed next to close button */
    .drag-square {
      width: 32px;
      height: 32px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      app-region: drag;
      -webkit-app-region: drag;
      transition: background 0.15s ease, color 0.15s ease;
      pointer-events: auto;
    }

    .drag-square svg {
      width: 14px;
      height: 14px;
      opacity: 0.6;
    }

    .control-btn {
      width: 44px;
      height: 32px;
      background: transparent;
      border: none;
      font-family: monospace, sans-serif;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
      app-region: no-drag;
      -webkit-app-region: no-drag;
    }

    /* Light Mode Styles */
    @media (prefers-color-scheme: light) {
      .drag-square svg { fill: #000000; }
      .drag-square:hover { background: rgba(0, 0, 0, 0.08); }
      .control-btn { color: #000000; }
      .control-btn:hover { background: rgba(0, 0, 0, 0.12); }
    }

    /* Dark Mode Styles */
    @media (prefers-color-scheme: dark) {
      .drag-square svg { fill: #ffffff; }
      .drag-square:hover { background: rgba(255, 255, 255, 0.12); }
      .control-btn { color: #ffffff; }
      .control-btn:hover { background: rgba(255, 255, 255, 0.15); }
    }

    .control-btn.close-btn:hover {
      background: #e81123 !important;
      color: #ffffff !important;
    }

    /* Fullscreen Webview with full click capability */
    controlledframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Top Right Overlay (Drag Square + Close Button) -->
  <div class="window-controls">
    <div class="drag-square" title="Drag window">
      <!-- 6-dot grip icon -->
      <svg viewBox="0 0 16 16">
        <circle cx="5" cy="3" r="1.5" />
        <circle cx="11" cy="3" r="1.5" />
        <circle cx="5" cy="8" r="1.5" />
        <circle cx="11" cy="8" r="1.5" />
        <circle cx="5" cy="13" r="1.5" />
        <circle cx="11" cy="13" r="1.5" />
      </svg>
    </div>
    <button id="close-btn" class="control-btn close-btn" title="Close">&#x2715;</button>
  </div>

  <!-- Fullscreen Web Content -->
  <controlledframe src="https://classroom.khanacademy.org" partition="persist:khan" allowfullscreen></controlledframe>
</body>
</html>
