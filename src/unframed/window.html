<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script type="module" src="/unframed/unframed.js"></script>
  <link rel="manifest" href="/.well-known/manifest.webmanifest" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      position: relative;
    }

    /* JS-managed Drag Bar Overlay */
    .draggable-bar {
      width: calc(100% - 44px);
      height: 32px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 99998;
      background: transparent;
      cursor: default;
    }

    /* Window Controls Overlay Container */
    .window-controls {
      position: absolute;
      top: 0;
      right: 0;
      height: 32px;
      z-index: 99999;
      display: flex;
      align-items: center;
      app-region: no-drag;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      width: 44px;
      height: 32px;
      background: transparent;
      border: none;
      font-family: monospace, sans-serif;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    @media (prefers-color-scheme: light) {
      .control-btn { color: #000000; }
      .control-btn:hover { background: rgba(0, 0, 0, 0.12); }
    }

    @media (prefers-color-scheme: dark) {
      .control-btn { color: #ffffff; }
      .control-btn:hover { background: rgba(255, 255, 255, 0.15); }
    }

    .control-btn.close-btn:hover {
      background: #e81123 !important;
      color: #ffffff !important;
    }

    /* Underlying Fullscreen Content */
    controlledframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Custom Drag Bar -->
  <div class="draggable-bar" id="drag-bar"></div>

  <!-- Close Button Container -->
  <div class="window-controls">
    <button id="close-btn" class="control-btn close-btn" title="Close">&#x2715;</button>
  </div>

  <!-- Main Web View -->
  <controlledframe src="https://classroom.khanacademy.org" partition="persist:khan" allowfullscreen></controlledframe>
</body>
</html>
